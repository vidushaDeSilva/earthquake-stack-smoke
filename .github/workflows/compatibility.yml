name: Earthquake stack compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AIVEN_BOOTSTRAP_SERVERS: ${{ vars.AIVEN_BOOTSTRAP_SERVERS }}
      AIVEN_TOPIC: ${{ vars.AIVEN_TOPIC }}
      AIVEN_KAFKA_USERNAME: ${{ secrets.AIVEN_KAFKA_USERNAME }}
      AIVEN_KAFKA_PASSWORD: ${{ secrets.AIVEN_KAFKA_PASSWORD }}
      AIVEN_KAFKA_CA_PEM: ${{ secrets.AIVEN_KAFKA_CA_PEM }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_VOLUME_ROOT: ${{ vars.DATABRICKS_VOLUME_ROOT }}
      DATABRICKS_TARGET_TABLE: ${{ vars.DATABRICKS_TARGET_TABLE }}
      DATABRICKS_JOB_ID: ${{ vars.DATABRICKS_JOB_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install small client dependencies
        run: python -m pip install -r requirements.txt
      - name: Probe USGS, Kafka, Volume and Delta
        run: python src/probe.py
